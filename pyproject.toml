[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-v2x-qos"
version = "0.1.0"
description = "Federated LSTM for NR-V2X QoS Prediction"
authors = [
    { name = "NR-V2X QoS Team" }
]
dependencies = [
    "torch>=2.0",
    "flwr>=1.18",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "joblib>=1.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-v2x-qos"
version = "0.1.0"
description = "Federated LSTM for NR-V2X QoS Prediction"
authors = [
    { name = "NR-V2X QoS Team" }
]
requires-python = ">=3.10"
# Keep in sync with requirements.txt
dependencies = [
    "torch==2.7.0",
    "flwr==1.18.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "scikit-learn==1.6.1",
    "pandas==2.3.1",
    "numpy==2.1.0",
    "pyyaml==6.0.2",
    "joblib==1.6.0",
    "onnx==1.20.1",
    "onnxruntime==1.31.0",
    "pydantic==2.11.7"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
